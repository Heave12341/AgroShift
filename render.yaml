services:
  - type: web
    name: agroshift-heave12341
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: "."
      - key: CORS_ORIGINS
        value: "https://heave12341.github.io,http://localhost:5173,http://127.0.0.1:5173"
      - key: ROTATION_IQ_WARM_CACHE
        value: "1"
      - key: ENVIRONMENT
        value: production
